name: Release

# Publishing a version is just pushing a semver tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# The tag drives versionName/versionCode in the APK and the GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner ships the Android SDK (ANDROID_HOME) with cmdline-tools, but
      # not necessarily the platform/build-tools this project targets.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      # The release keystore is stored base64-encoded in Actions secrets; decode
      # it to the path referenced by keystore.properties below.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/satellite-release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/satellite-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (m.m.p padded/gap-tolerant).
      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "code=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))" >> "$GITHUB_OUTPUT"
          else
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --stacktrace

      - name: Rename APK for the release
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$SRC" "dist/satellite-${{ steps.version.outputs.tag }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "$TAG" \
              --generate-notes
          fi
