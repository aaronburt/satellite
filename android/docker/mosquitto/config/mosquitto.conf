# Mosquitto configuration for the SatelliteAndroid development environment.
#
# MQTT v5 and 3.1.1 are both supported by Mosquitto 2.x; clients choose the
# protocol version at CONNECT time. Home Assistant requires the *broker* to
# support v5.

listener 1883 0.0.0.0

# Username/password authentication.
# The password file lives on the writable data volume (gitignored):
#   docker compose exec mosquitto mosquitto_passwd -c -b /mosquitto/data/passwd <user> <password>
# Default dev account: satellite / satellite (see docker/README.md).
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------------------
# Optional TLS listener (enable after generating certificates)
# ---------------------------------------------------------------------------
# listener 8883 0.0.0.0
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
