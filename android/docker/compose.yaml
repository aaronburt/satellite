name: satelliteandroid-dev

# Development/test environment for SatelliteAndroid:
#   - Mosquitto: local MQTT 5 broker (username/password; dev account satellite/satellite)
#   - Home Assistant: consumer of MQTT discovery messages
#
# Usage: see docker/README.md
#
# NOTE: This environment is for local development only. Do not expose it to
# untrusted networks (anonymous MQTT + no HA auth beyond localhost).

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sa-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSockets (unused for now, handy for MQTT Explorer)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./samples:/samples:ro
    healthcheck:
      # Fails until the broker accepts a subscription.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-u", "satellite", "-P", "satellite", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: sa-homeassistant
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8123:8123"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./homeassistant/config:/config
