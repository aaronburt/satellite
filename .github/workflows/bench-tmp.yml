name: Screen thumbnail benchmark
on:
  push:
    branches: [ claude/project-thread-vl8vmc ]
jobs:
  bench:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'windows/go.mod'
      - name: Benchmark
        run: go test ./internal/screenthumb -run TestCaptureReportsScreenSize -v -bench . -benchmem -benchtime 3s -count 3
