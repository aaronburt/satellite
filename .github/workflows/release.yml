name: Release on Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content -Path "internal/config/config.go" -Raw
          if ($content -match 'const\s+Version\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            Write-Host "Found version: $version"
            "version=$version" >> $env:GITHUB_OUTPUT
            "tag=v$version" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find 'const Version' in internal/config/config.go"
            exit 1
          }

      - name: Check if Release Exists
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.get_version.outputs.tag }}"
          $existing = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if (($existing -split "`r?`n") -contains $tag) {
            Write-Host "Release $tag already exists. Skipping release build."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $tag does not exist. Proceeding with build."
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - name: Set up Go
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Inno Setup
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Binary
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: go build -ldflags="-H windowsgui -s -w" -o satellite.exe .

      - name: Build Linux Binary
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w" -o satellite-linux-amd64 .
          $env:GOOS = "windows"

      - name: Build Inno Setup Installer
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path "C:\ProgramData\chocolatey\bin\iscc.exe") {
            & "C:\ProgramData\chocolatey\bin\iscc.exe" installer.iss
          } else {
            Write-Error "Could not find Inno Setup compiler ISCC.exe"
            exit 1
          }

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $tag = "${{ steps.get_version.outputs.tag }}"
          $installer = "dist/Satellite-Setup-v$version.exe"

          gh release create $tag satellite.exe $installer satellite-linux-amd64 `
            --title "$tag" `
            --generate-notes
