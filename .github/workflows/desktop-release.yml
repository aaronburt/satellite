name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '!windows/**/*.md'
      - '!windows/docs/**'
      - '.github/workflows/desktop-release.yml'
      - '.github/scripts/platform-version.sh'
      - '.github/scripts/next-version.sh'
  workflow_run:
    workflows: ['Release bridge']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    name: Resolve desktop version
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      code: ${{ steps.version.outputs.code }}
      exists: ${{ steps.version.outputs.exists }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve version and changes
        id: version
        run: bash .github/scripts/platform-version.sh desktop >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows and Linux binaries and installer
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'windows/go.mod'
          cache: true
          cache-dependency-path: windows/go.sum

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y --skip-if-installed
          }
      - name: Run tests
        shell: pwsh
        run: go test -count=1 ./...

      - name: Build Binaries
        shell: pwsh
        run: |
          $setVersion = "-X satellite/internal/config.Version=${{ needs.version.outputs.version }}"
          go build -ldflags="-H windowsgui -s -w $setVersion" -o satellite.exe .
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w $setVersion" -o satellite-linux-amd64 .
          $env:GOOS = "windows"

      - name: Smoke Test Binaries
        shell: pwsh
        run: |
          foreach ($f in @("satellite.exe", "satellite-linux-amd64")) {
            if (-not (Test-Path $f)) { Write-Error "$f missing"; exit 1 }
            $size = (Get-Item $f).Length
            if ($size -lt 1MB) {
              Write-Error "$f suspiciously small ($size bytes)"
              exit 1
            }
            Write-Host "$f OK ($([math]::Round($size/1MB,1)) MB)"
            $want = "config.Version=${{ needs.version.outputs.version }}"
            if (-not (go version -m $f | Select-String -SimpleMatch $want)) {
              Write-Error "$f was not built with $want"
              exit 1
            }
          }

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = $null
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            $iscc = "iscc"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\ProgramData\chocolatey\bin\iscc.exe") {
            $iscc = "C:\ProgramData\chocolatey\bin\iscc.exe"
          } else {
            Write-Error "Could not find Inno Setup compiler ISCC.exe"
            exit 1
          }
          $version = "${{ needs.version.outputs.version }}"
          & $iscc "/DMyAppVersion=$version" installer.iss
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item satellite.exe, satellite-linux-amd64 -Destination staging
          Copy-Item "dist/Satellite-Setup-v${{ needs.version.outputs.version }}.exe" -Destination staging
          Get-ChildItem staging | Format-Table Name, Length

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: windows/staging
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: [version, windows]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: dist
      - name: Verify assets
        run: |
          test -f dist/satellite.exe
          test -f dist/satellite-linux-amd64
          test -f "dist/Satellite-Setup-v${{ needs.version.outputs.version }}.exe"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "$TAG" dist/* --target "$TARGET_SHA" --title "Desktop ${{ needs.version.outputs.version }}" --generate-notes --latest=false
