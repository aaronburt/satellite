name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK packages
        id: sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Unit tests
        id: tests
        run: ./gradlew test --stacktrace

      # Lint still runs when tests fail so both reports are available.
      - name: Android Lint
        id: lint
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./gradlew lint --stacktrace

      # Reports keep their module path (e.g. core/mqtt/build/test-results/...).
      # Only upload once a Gradle step actually ran, so a setup failure doesn't
      # add a misleading missing-file error.
      - name: Upload unit-test reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && steps.tests.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            android/**/build/test-results/
            android/**/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' && steps.lint.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            android/**/build/reports/lint-results-*.xml
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/lint-results-*.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  kotlin-quality:
    name: Kotlin format and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Kotlin check tools
        uses: actions/cache@v4
        with:
          path: android/.tools
          key: kotlin-tools-${{ hashFiles('android/scripts/kotlin-checks.sh') }}

      - name: ktlint and detekt
        run: scripts/kotlin-checks.sh

  datastore-windows:
    name: DataStore tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name 'sdkmanager.bat' -type f | sort | tail -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      - name: DataStore unit tests
        shell: bash
        run: ./gradlew.bat :core:datastore:testDebugUnitTest --stacktrace
